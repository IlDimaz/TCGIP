{% extends 'base.html' %}

{% block title %}Conferma eliminazione{% endblock %}

{% block content %}
<h1>Conferma eliminazione</h1>
<p>Sei sicuro di voler eliminare "{{ object.card.name }}" dalla tua collezione?</p>

<!-- Semplice conferma esplicita prima di eliminare definitivamente -->
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Elimina</button>
    <a href="{% url 'collection' %}" class="btn btn-secondary">Annulla</a>
</form>
{% endblock %}
